# The `contents:` block of the `fermix` engine package, resolved.
#
# Every `src:` is relative to the root of this archive, so a build that runs
# nFPM from the unpacked `fermix_app_engine/` directory installs the engine's
# files at the paths and modes the headless `fermix` package installs them at.
# /usr/share/doc/fermix/changelog.Debian.gz is deliberately absent: the
# combined desktop package ships one changelog, its own.
contents:
  - src: tree/usr/bin/fermix
    dst: /usr/bin/fermix
    file_info:
      mode: 0755

  - src: tree/usr/lib/fermix/cosign
    dst: /usr/lib/fermix/cosign
    file_info:
      mode: 0755

  # The verified loader input. The package configuration step materialises it
  # into /var/lib/fermix/runtimes/<digest>/libc-musl.so, which is the address
  # every packaged ELF interpreter names.
  - src: tree/usr/lib/fermix/runtime-payload/libc-musl-71c35316aff45bbfd243d8eb9bfc4a58b6eb97cee09514cd2030e145b68107fb.so
    dst: /usr/lib/fermix/runtime-payload/libc-musl-71c35316aff45bbfd243d8eb9bfc4a58b6eb97cee09514cd2030e145b68107fb.so
    file_info:
      mode: 0644

  - src: tree/usr/lib/systemd/user/fermix.service
    dst: /usr/lib/systemd/user/fermix.service
    file_info:
      mode: 0644

  - src: tree/usr/share/fermix/engine.json
    dst: /usr/share/fermix/engine.json
    file_info:
      mode: 0644

  - src: tree/usr/share/bash-completion/completions/fermix
    dst: /usr/share/bash-completion/completions/fermix
    file_info:
      mode: 0644

  - src: tree/usr/share/zsh/site-functions/_fermix
    dst: /usr/share/zsh/site-functions/_fermix
    file_info:
      mode: 0644

  - src: tree/usr/share/fish/vendor_completions.d/fermix.fish
    dst: /usr/share/fish/vendor_completions.d/fermix.fish
    file_info:
      mode: 0644

  - src: tree/usr/share/man/man1/fermix.1.gz
    dst: /usr/share/man/man1/fermix.1.gz
    file_info:
      mode: 0644

  - src: tree/usr/share/doc/fermix/copyright
    dst: /usr/share/doc/fermix/copyright
    file_info:
      mode: 0644
