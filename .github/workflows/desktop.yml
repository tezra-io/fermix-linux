# The desktop app's gate, on every pull request and every push to main: the
# desktop entry validated, then the same `scripts/dev.sh check` a developer runs
# (rustfmt, clippy with warnings as errors, every test, all inside the GNOME 50
# SDK). release.yml builds the packages. A push to dev runs nothing; `gh workflow
# run desktop.yml --ref <branch>` runs it on any branch by hand. It runs on Blacksmith's 4-vCPU
# runner, which needs Blacksmith's app enabled for this repository; no release runs here.
name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit cancels a pull request's older run; main's runs queue.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # GNOME 50 Platform and SDK preinstalled; flatpak needs the privileges for bubblewrap.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      XDG_RUNTIME_DIR: /tmp/runtime
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mesa's GL: the mascot's render tests draw offscreen with llvmpipe, as there is no GPU here.
      # Both go to the user installation, which flatpak searches for extensions as it does the
      # system one. The image's system installation already holds a GL.default, and updating it
      # moves the old deployment out of the image's layer, which Blacksmith's container storage
      # refuses with "Invalid cross-device link".
      - name: Install the Rust SDK extension and Mesa
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --or-update flathub \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Platform.GL.default//25.08

      - name: Validate the desktop entry
        run: flatpak run --filesystem="$PWD" --command=desktop-file-validate org.gnome.Sdk//50 "$PWD/data/io.tezra.Fermix.desktop"

      - name: Format, lint and test
        run: scripts/dev.sh check
