name: packages

# The packages, built on demand and on any change that could alter them.
#
# `app.yml` builds and gates the crate on every push; it does not build a deb or
# an rpm, because that takes minutes and most changes cannot affect one. This
# workflow covers the changes that can: the nFPM configuration and everything
# else under packaging/, the build script itself, the crate's version, and this
# workflow and the action it shares with the release rail. It signs nothing and
# publishes nothing. The artifacts exist so a reviewer can install what a pull
# request would ship before the tag that ships it.
#
# It builds through the same composite action the release rail's build job uses,
# so a change to how a package is built reaches both at once.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build_packages.sh"
      - "App/Fermix/Cargo.toml"
      - ".github/workflows/packages.yml"
      - ".github/actions/build-packages/action.yml"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The version is the crate's, read here rather than typed: the release
      # rail refuses a tag that disagrees with it, so there is one number.
      - name: The version this build carries
        id: version
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' App/Fermix/Cargo.toml)"
          [ -n "$version" ] || { echo "::error::App/Fermix/Cargo.toml names no version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "fermix-desktop $version (${{ matrix.arch }})"

      - name: Build both packages
        uses: ./.github/actions/build-packages
        with:
          version: ${{ steps.version.outputs.version }}
          arch: ${{ matrix.arch }}
          # A build id that says which run made it, so a package handed to a
          # reviewer can be traced back to the run that built it and can never
          # be mistaken for a released generation.
          build-id: pr-${{ github.run_id }}
          source-commit: ${{ github.sha }}
          artifact-name: fermix-desktop-packages-${{ matrix.arch }}
          retention-days: "7"
