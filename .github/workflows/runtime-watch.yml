name: runtime-watch

# The CVE surface the private runtime takes on, answered by a rail rather than
# by intent (amendment section 4.5).
#
# Bundling GTK, GLib, libadwaita and everything under them means owning the
# advisories a distribution would otherwise patch for us. Once a week and on
# demand, `scripts/runtime_watch.py` reads every component of
# `packaging/runtime/RUNTIME.lock.json`, asks OSV what is known about that name
# and version and release-monitoring.org what upstream has released since, and
# writes one finding per component that has something to say. This workflow is
# the wiring: it turns each finding into one issue and closes nothing.
#
# It opens nothing when there is nothing to say. A component the script has no
# coordinate for is itself a finding, because a watcher that quietly skipped a
# library reads exactly like a watcher that found nothing wrong.
#
# There is no automatic bump. A GTK point release can change rendering and the
# reference captures are a reviewed artifact, so the output is an issue for a
# person and the bump is a change to the lock file.
#
# Actions are pinned to immutable commit SHAs (M38 section 12.2).
on:
  schedule:
    # Mondays, early. A weekly cadence is what a bundled toolkit needs: a daily
    # run would produce the same issue seven times before anybody read it.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Advisories and upstream releases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The one thing this workflow writes.
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Its own refusals first. A watcher whose version comparison was wrong
      # would report nothing and read as a clean week.
      - name: The watcher's own gate
        run: scripts/runtime_watch_test.sh

      - name: Read every component
        run: python3 scripts/runtime_watch.py --out findings

      # One issue per finding, found by its exact title so that a second week
      # with the same answer edits the first week's issue rather than opening a
      # second one. Titles come out of the script and are read from the file,
      # never interpolated into this script.
      - name: Open or update one issue per finding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s findings/index.tsv ]; then
            echo "::notice::every component of the runtime is current and carries no advisory"
            exit 0
          fi

          while IFS="$(printf '\t')" read -r component title; do
            [ -n "$component" ] || continue
            # Matched on the exact title through jq's environment rather than
            # by interpolating it into the filter, so a title is data here too.
            number="$(TITLE="$title" gh issue list --repo "$REPO" --state open \
              --limit 200 --json number,title \
              --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
            if [ -z "$number" ]; then
              gh issue create --repo "$REPO" --title "$title" \
                --body-file "findings/$component.md"
              echo "opened: $title"
            else
              gh issue edit "$number" --repo "$REPO" \
                --body-file "findings/$component.md"
              echo "updated #$number: $title"
            fi
          done < findings/index.tsv

      - name: Keep what it read
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-findings
          path: findings/*
          if-no-files-found: warn
          retention-days: 30
