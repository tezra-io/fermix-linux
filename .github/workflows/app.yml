name: app

# Every push and every pull request. It needs no secrets and produces no
# release artifact.
#
# Everything runs inside the build container, because the runner image carries a
# GTK below this application's floor and a green build against a newer toolkit
# proves nothing about the one a user has. The container is built from the
# checkout rather than pulled, so the workflow and a developer's own
# `scripts/container_build.sh` run the same image.
#
# Actions are pinned to immutable commit SHAs (M38 section 12.2).
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Fermix for Linux (build + gates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Cheapest possible gate, and it runs first: every shell script in the
      # repository must at least parse. A gate with a syntax error is otherwise
      # discovered by the release that needed it.
      - name: Shell syntax
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: One string, six places
        run: scripts/check_app_identity.sh

      - name: The contract pin
        run: scripts/verify_contract.sh

      - name: The gates that are shell
        run: |
          set -euo pipefail
          scripts/verify_contract_test.sh
          scripts/check_app_identity_test.sh
          scripts/check_vendor_marks_test.sh
          scripts/container_build_test.sh
          scripts/verify_engine_test.sh
          scripts/build_packages_test.sh
          scripts/install_smoke_test.sh
          scripts/render_install_notes_test.sh
          scripts/engine_bump_test.sh
          scripts/asset_name_test.sh
          scripts/check_no_network_test.sh
          scripts/check_copyright_test.sh
          scripts/check_private_runtime_test.sh
          scripts/runtime_watch_test.sh
          packaging/runtime/build_runtime_test.sh

      - name: Build the container
        run: docker build -f packaging/docker/Dockerfile.build -t fermix-desktop-build packaging/docker

      # What a desktop reads, checked against its own specification, on every
      # push rather than only at release time. `--no-net` because a gate that
      # fetches screenshot images and the OARS vocabulary is a gate that fails
      # when a third party is down. Nothing is accepted: a warning or an error
      # fails the build, and docs/RELEASING.md says what this validator reports
      # about this file and why the run does not ask for pedantic hints.
      - name: The desktop entry and the metainfo
        run: |
          set -euo pipefail
          docker run --rm --init \
            -v "$PWD:/workspace" -w /workspace \
            fermix-desktop-build bash -c '
              set -euo pipefail
              desktop-file-validate packaging/io.tezra.Fermix.desktop
              appstreamcli validate --no-net --explain packaging/io.tezra.Fermix.metainfo.xml
            '

      - name: Format, lint, test
        run: |
          set -euo pipefail
          docker run --rm --init \
            -v "$PWD:/workspace" -w /workspace/App/Fermix \
            -e CARGO_TERM_COLOR=always \
            fermix-desktop-build bash -c '
              set -euo pipefail
              cargo fmt --check
              cargo clippy --all-targets -- -D warnings
              # One link at a time past two: each test binary statically
              # links the whole toolkit, and eight at once exhausts the
              # memory of the runner. No apostrophe may appear in this
              # single-quoted script: one did, and cargo test ran on the host.
              cargo test --jobs 2
            '

      - name: Test with a display
        run: |
          set -euo pipefail
          docker run --rm --init \
            -v "$PWD:/workspace" -w /workspace/App/Fermix \
            -e CARGO_TERM_COLOR=always \
            fermix-desktop-build bash -c '
              set -euo pipefail
              FERMIX_GTK_TESTS=1 xvfb-run -a cargo test --jobs 2 --test widgets -- --nocapture
            '

      # The claim that this window opens no connection, measured against the
      # binary that was just built rather than asserted in a comment.
      #
      # It runs here and again in `scripts/build_packages.sh` on the release
      # path, deliberately. The failure it catches is invisible at build time
      # and at load time: the `g_tls_*` and `g_resolver_*` entry points are
      # defined by libgio itself, so an application that calls one links, loads
      # and starts, and only fails in front of a user, where the private GLib
      # has no glib-networking backend to answer with. A gate against a failure
      # nothing else notices is worth a second in both places.
      - name: The application opens no network connection
        run: |
          set -euo pipefail
          docker run --rm --init \
            -v "$PWD:/workspace" -w /workspace \
            fermix-desktop-build bash -c '
              set -euo pipefail
              scripts/check_no_network.sh
            '

      - name: The copy gates
        run: |
          set -euo pipefail
          docker run --rm --init \
            -v "$PWD:/workspace" -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/App/Fermix/target \
            fermix-desktop-build bash -c '
              set -euo pipefail
              scripts/check_copy.sh
              scripts/check_copy_test.sh
            '
