[package]
name = "fermix-client"
version = "0.1.0"
description = "Talks to the Fermix daemon over its local sockets. No GTK, so it tests on any host."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
# The speech gate's voice detector: pure Rust, no dependencies, a 40 KiB network.
earshot = "1.2.2"
pulldown-cmark = { version = "0.13", default-features = false }
# The phone's pairing code: the modules only, with no image or SVG writer.
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Reads a pairing code back the way a phone's camera would, with no image crate.
rqrr = { version = "0.11", default-features = false }
tempfile = "3"

[lints]
workspace = true
