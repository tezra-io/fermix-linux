[package]
name = "fermix-client"
version = "0.1.0"
description = "Talks to the Fermix daemon over its local sockets. No GTK, so it tests on any host."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
