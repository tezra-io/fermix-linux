[package]
name = "fermix-desktop"
version = "0.1.0"
description = "Fermix for Linux: set up Fermix and chat with it"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fermix-client = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
serde_json = "1"
futures-channel = "0.3"
gst = { package = "gstreamer", version = "0.25", features = ["v1_16"] }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-audio = { package = "gstreamer-audio", version = "0.25" }

[build-dependencies]
glib-build-tools = "0.22"

[lints]
workspace = true
